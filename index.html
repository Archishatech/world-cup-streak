<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup 2026 | Master Predictor</title>
    <style>
        :root { --gold: #FFD700; --dark: #0a0a0a; --card: #1a1a1a; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; padding-bottom: 50px; }
        
        /* Navigation */
        nav { background: #000; padding: 20px; text-align: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; font-size: 14px; }

        /* Hero Header */
        .hero { text-align: center; padding: 40px 20px; }
        h1 { color: var(--gold); letter-spacing: 3px; transition: 0.5s; }

        /* Search Bar Area */
        .search-container { text-align: center; margin-bottom: 30px; }
        #myInput { padding: 12px; width: 60%; max-width: 400px; border-radius: 25px; border: 1px solid var(--gold); background: #222; color: white; outline: none; }

        /* Grid for Match Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1100px; margin: auto; padding: 0 20px; }

        /* Match Card Styling */
        .card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #333; text-align: center; transition: 0.3s; }
        .card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .flag-box { display: flex; justify-content: space-around; align-items: center; margin: 15px 0; }
        .flag-box img { width: 45px; border-radius: 3px; }
        
        input[type="number"] { width: 40px; padding: 5px; text-align: center; border-radius: 5px; border: none; }
        .btn-predict { background: var(--gold); color: black; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }

        /* Trophy Animation */
        #trophy-overlay {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0); z-index: 1000;
            font-size: 100px; transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .show-trophy { display: block !important; transform: translate(-50%, -50%) scale(1.5) !important; }
        .confetti { position: fixed; width: 8px; height: 8px; z-index: 999; }
    </style>
</head>
<body>

    <div id="trophy-overlay">🏆</div>

    <nav>
        <a href="#">DASHBOARD</a>
        <a href="#">SCHEDULE</a>
        <button onclick="toggleLang()" style="background:none; border:1px solid var(--gold); color:var(--gold); cursor:pointer; padding:5px; border-radius:5px;">FR/EN</button>
    </nav>

    <div class="hero">
        <h1 id="title">WORLD CUP 2026</h1>
        <p id="subtitle">Loading player...</p>
    </div>

    <div class="search-container">
        <input type="text" id="myInput" onkeyup="searchFunction()" placeholder="Search for a team...">
    </div>

    <div id="match-list" class="grid"></div>

    <script>

        // 1. DATABASE (Now pulling live data!)
let matchData = [];

async function loadMatches() {
    const res = await fetch("https://api.football-data.org/v4/matches", {
        headers: { "X-Auth-Token": "ff8fb7f5d23b475591e9a186ae9518fe" } // your key
    });
    const data = await res.json();
    matchData = data.matches;
    renderMatches(); // <-- call the function after data loads
}

// Call once at start
loadMatches();

// Refresh every 60 seconds
setInterval(loadMatches, 60000);

// ---------------------------
// Separate function (NOT inside loadMatches)
function renderMatches() {
    const list = document.getElementById('match-list');
    list.innerHTML = ""; 
    matchData.forEach((match, i) => {
        list.innerHTML += `
            <div class="card">
                <span style="color:gray; font-size:11px;">Kickoff: ${new Date(match.utcDate).toLocaleString()}</span>
                <div class="flag-box">
                    <div><br>${match.homeTeam.name}</div>
                    <div style="color:var(--gold);">VS</div>
                    <div><br>${match.awayTeam.name}</div>
                </div>
                <input type="number" id="uH-${i}" placeholder="0"> - <input type="number" id="uA-${i}" placeholder="0">
                <button class="btn-predict" onclick="check(${i})">CHECK RESULT</button>
                <p id="res-${i}" style="font-size:12px; margin-top:10px;"></p>
            </div>`;
    });
}



        // 2. LOGIN & MEMORY
        let userName = localStorage.getItem("wc_user") || prompt("Enter your name to start predicting:");
        if (userName) localStorage.setItem("wc_user", userName);
        let correctCount = parseInt(localStorage.getItem("wc_score")) || 0;

        function updateStatus() {
            document.getElementById('subtitle').innerText = `Player: ${userName} | Correct: ${correctCount}/3`;
            if (correctCount >= 3) {
                document.getElementById('title').innerText = "🏆 MASTER PREDICTOR";
                document.getElementById('title').style.color = "#00ff00";
            }
        }

        // 3. RENDER CARDS
        function renderMatches() {
            const list = document.getElementById('match-list');
            list.innerHTML = ""; 
            matchData.forEach((match, i) => {
                list.innerHTML += `
                    <div class="card">
                        <span style="color:gray; font-size:11px;">Kickoff: ${match.time}</span>
                        <div class="flag-box">
                            <div><img src="https://flagcdn.com/w80/${match.hFlag}.png"><br>${match.home}</div>
                            <div style="color:var(--gold);">VS</div>
                            <div><img src="https://flagcdn.com/w80/${match.aFlag}.png"><br>${match.away}</div>
                        </div>
                        <input type="number" id="uH-${i}" placeholder="0"> - <input type="number" id="uA-${i}" placeholder="0">
                        <button class="btn-predict" onclick="check(${i})">CHECK RESULT</button>
                        <p id="res-${i}" style="font-size:12px; margin-top:10px;"></p>
                    </div>`;
            });
        }

        // 4. CHECK LOGIC & REWARD
      function check(i) {
    const h = parseInt(document.getElementById(`uH-${i}`).value);
    const a = parseInt(document.getElementById(`uA-${i}`).value);
    const msg = document.getElementById(`res-${i}`);
    const m = matchData[i];

    // If the match hasn't been played yet
    if (m.score.fullTime.home === null || m.score.fullTime.away === null) {
        msg.innerText = "Match scheduled soon!";
        msg.style.color = "gray";
    } 
    // If the prediction is correct
    else if (h === m.score.fullTime.home && a === m.score.fullTime.away) {
        msg.innerText = "✅ Correct prediction!";
        msg.style.color = "#2ecc71";
        correctCount++;
        localStorage.setItem("wc_score", correctCount);
        updateStatus();
        if (correctCount % 3 === 0) showReward();
    } 
    // If the prediction is wrong
    else {
        msg.innerText = `❌ No, it was ${m.score.fullTime.home}-${m.score.fullTime.away}`;
        msg.style.color = "#e74c3c";
    }
}



        function showReward() {
            const t = document.getElementById('trophy-overlay');
            t.classList.add('show-trophy');
            for(let i=0; i<50; i++) createConfetti();
            setTimeout(() => t.classList.remove('show-trophy'), 4000);
        }

        function createConfetti() {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.top = '-10px';
            c.style.backgroundColor = ['#FFD700','#FFF','#FFA500'][Math.floor(Math.random()*3)];
            document.body.appendChild(c);
            let p = 0;
            let id = setInterval(() => {
                if (p > 100) { clearInterval(id); c.remove(); }
                else { p++; c.style.top = p + 'vh'; }
            }, 25);
        }

        function searchFunction() {
            let input = document.getElementById('myInput').value.toUpperCase();
            let cards = document.getElementsByClassName('card');
            for (let i = 0; i < cards.length; i++) {
                cards[i].style.display = cards[i].innerText.toUpperCase().includes(input) ? "" : "none";
            }
        }

        renderMatches();
        updateStatus();
    </script>
</body>
</html>
